[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipharm"
version = "2.17.1"
description = "OMNI-PHARM: personalized multi-drug interaction risk prediction (local, offline)"
readme = "README.md"
requires-python = "==3.11.*"
# torch is installed separately from the CUDA index (see README) and is intentionally not listed
# here so pip never replaces it with a CPU build.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "rdkit>=2024.9",
    "torch_geometric>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "requests>=2.32",
    "tqdm>=4.66",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "gpu: requires CUDA GPU",
    "slow: long-running test (loads real data / models)",
]

[tool.ruff]
line-length = 145
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-3: Korean text / typographic characters are intentional; E741: I/J are matrix-style pair indices
ignore = ["RUF001", "RUF002", "RUF003", "E741", "SIM105", "SIM117", "SIM905"]
